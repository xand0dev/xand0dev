<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="CogniTrace — Self-hosted analyst board: entities, evidence-backed claims and live runs on a graph canvas.">
<title>CogniTrace — Self-hosted analyst board: entities, evidence-backed claims and live runs on a graph canvas.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
.breathe{animation:breathe 4s ease-in-out infinite}
.compact{display:none} @media (max-width:300px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
</defs>

<rect x="1" y="1" width="598" height="298" rx="16" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<g class="full">
  <text x="36" y="52" class="m" font-size="12" fill="#5E636B" font-weight="700" letter-spacing="2.4" xml:space="preserve">ANALYST BOARD  ·  PRIVATE  ·  63 COMMITS</text>
  <text x="34" y="104" class="s" font-size="38" fill="#F2F3F5" font-weight="800" letter-spacing="-1.2" >CogniTrace</text>
  <text x="36" y="146" class="s" font-size="18" fill="#9A9FA7" >Self-hosted analyst board: entities,</text><text x="36" y="172" class="s" font-size="18" fill="#9A9FA7" >evidence-backed claims and live</text><text x="36" y="198" class="s" font-size="18" fill="#9A9FA7" >runs on a graph canvas.</text>
  <text x="36" y="244" class="m" font-size="13.5" fill="#B5BAC1" font-weight="500" >author · FastAPI · realtime · graph UI</text>
  <text x="36" y="268" class="m" font-size="12.5" fill="#5E636B" font-weight="500" xml:space="preserve">FastAPI  ·  Redis Streams  ·  React Flow  ·  WebSocket</text>
  <path d="M488 142 L426 96" stroke="#25272B" stroke-width="1.5"/><path d="M488 142 L494 78" stroke="#25272B" stroke-width="1.5"/><path d="M488 142 L554 112" stroke="#25272B" stroke-width="1.5"/><path d="M488 142 L418 164" stroke="#25272B" stroke-width="1.5"/><path d="M488 142 L550 186" stroke="#25272B" stroke-width="1.5"/><path d="M488 142 L470 204" stroke="#25272B" stroke-width="1.5"/><path d="M426 96 L494 78" stroke="#25272B" stroke-width="1.5"/><path d="M554 112 L550 186" stroke="#25272B" stroke-width="1.5"/><path d="M418 164 L470 204" stroke="#25272B" stroke-width="1.5"/><path d="M494 78 L554 112" stroke="#25272B" stroke-width="1.5"/><rect x="415" y="88" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/><rect x="483" y="70" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/><rect x="543" y="104" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/><rect x="407" y="156" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/><rect x="479" y="133" width="18" height="18" rx="3" fill="#FF2A2A" filter="url(#glow)" class="breathe"/><rect x="539" y="178" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/><rect x="459" y="196" width="22" height="16" rx="3" fill="#050506" stroke="#8E949C" stroke-width="1.5"/>
</g>
<g class="compact">
  <circle cx="44" cy="62" r="7" fill="#FF2A2A" filter="url(#glow)"/>
  <text x="66" y="72" class="m" font-size="28" fill="#5E636B" font-weight="700" letter-spacing="2" >PRIVATE</text>
  <text x="34" y="172" class="s" font-size="78" fill="#F2F3F5" font-weight="800" letter-spacing="-2" >CogniTrace</text>
  <text x="36" y="236" class="s" font-size="36" fill="#9A9FA7" >Evidence graph board</text>
</g>

</svg>
