<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="AI Pool Starter — One tool, the whole model pool.">
<title>AI Pool Starter — One tool, the whole model pool.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
.breathe{animation:breathe 4s ease-in-out infinite}
</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
</defs>

<rect x="1" y="1" width="598" height="138" rx="14" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<g>
  <text x="34" y="56" class="s" font-size="27" fill="#F2F3F5" font-weight="800" letter-spacing="-0.8" >AI Pool Starter</text>
  <text x="578" y="30" class="m" font-size="14" fill="#5E636B" font-weight="700" text-anchor="end" >↗</text>
  <circle cx="500" cy="70" r="40" fill="none" stroke="#1F2125" stroke-width="1.5"/><circle cx="500.0" cy="30.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><circle cx="534.6" cy="50.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><circle cx="534.6" cy="90.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><circle cx="500.0" cy="110.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><circle cx="465.4" cy="90.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><circle cx="465.4" cy="50.0" r="6" fill="#0B0C0E" stroke="#4A4E55" stroke-width="1.5"/><g><circle cx="500.0" cy="30.0" r="6" fill="#FF2A2A"/><circle cx="500.0" cy="30.0" r="11" fill="none" stroke="#FF2A2A" stroke-opacity=".45" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" values="0 500 70;60 500 70;120 500 70;180 500 70;240 500 70;300 500 70" dur="6s" repeatCount="indefinite" calcMode="discrete"/></g><text x="500" y="74" class="m" font-size="10.5" fill="#C9CDD3" font-weight="700" text-anchor="middle" >/models</text>
  <text x="36" y="90" class="s" font-size="16.5" fill="#9A9FA7" >One tool, the whole model pool.</text>
  <text x="36" y="116" class="m" font-size="12" fill="#5E636B" font-weight="600" letter-spacing="1.6" xml:space="preserve">WORKSHOP · KAI 2026</text>
</g>

</svg>
