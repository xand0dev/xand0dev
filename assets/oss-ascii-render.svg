<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="ASCII Render — Any video into living ASCII art, in the browser.">
<title>ASCII Render — Any video into living ASCII art, in the browser.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
.breathe{animation:breathe 4s ease-in-out infinite}
.compact{display:none} @media (max-width:300px){.full{display:none} .compact{display:inline}}</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#34363B"/><stop offset=".5" stop-color="#16171A"/><stop offset="1" stop-color="#26282C"/>
</linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="redLight"><stop offset="0" stop-color="#E0101A" stop-opacity=".5"/>
  <stop offset=".4" stop-color="#E0101A" stop-opacity=".12"/><stop offset="1" stop-color="#E0101A" stop-opacity="0"/></radialGradient>
</defs>

<rect x="1" y="1" width="598" height="138" rx="14" fill="#050506" stroke="url(#edge)" stroke-width="1.5"/>
<g class="full">
  <text x="34" y="56" class="s" font-size="27" fill="#F2F3F5" font-weight="800" letter-spacing="-0.8" >ASCII Render</text>
  <text x="578" y="30" class="m" font-size="14" fill="#5E636B" font-weight="700" text-anchor="end" >↗</text>
  <text x="448" y="40" class="m" font-size="13" font-weight="700" fill="#9EA4AD" xml:space="preserve" opacity=".2">  .:-=+*#%@<animate attributeName="opacity" values=".15;1;1;.15" keyTimes="0;0.10;.8;1" dur="4s" repeatCount="indefinite"/></text><text x="448" y="56" class="m" font-size="13" font-weight="700" fill="#9EA4AD" xml:space="preserve" opacity=".2"> .:-=+*#%@%<animate attributeName="opacity" values=".15;1;1;.15" keyTimes="0;0.18;.8;1" dur="4s" repeatCount="indefinite"/></text><text x="448" y="72" class="m" font-size="13" font-weight="700" fill="#FF2A2A" xml:space="preserve" opacity=".2">.:-=+*#%@%#<animate attributeName="opacity" values=".15;1;1;.15" keyTimes="0;0.26;.8;1" dur="4s" repeatCount="indefinite"/></text><text x="448" y="88" class="m" font-size="13" font-weight="700" fill="#9EA4AD" xml:space="preserve" opacity=".2">:-=+*#%@%#*<animate attributeName="opacity" values=".15;1;1;.15" keyTimes="0;0.34;.8;1" dur="4s" repeatCount="indefinite"/></text><text x="448" y="104" class="m" font-size="13" font-weight="700" fill="#9EA4AD" xml:space="preserve" opacity=".2">-=+*#%@%#*+<animate attributeName="opacity" values=".15;1;1;.15" keyTimes="0;0.42;.8;1" dur="4s" repeatCount="indefinite"/></text>
  <text x="36" y="90" class="s" font-size="16.5" fill="#9A9FA7" >Any video into living ASCII art, in the browser.</text>
  <text x="36" y="116" class="m" font-size="12" fill="#5E636B" font-weight="600" letter-spacing="1.6" xml:space="preserve">TYPESCRIPT · MCP TOOL · MP4 / GIF</text>
</g>
<g class="compact">
  <text x="34" y="92" class="s" font-size="62" fill="#F2F3F5" font-weight="800" letter-spacing="-1.5" >ASCII Render</text>
  <text x="570" y="92" class="m" font-size="44" fill="#FF2A2A" font-weight="700" text-anchor="end" >↗</text>
</g>

</svg>
