<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Oleksandr's centered end-to-end engineering path</title>
  <desc id="desc">A visual product path from backend through web and mobile to cloud release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090A0C"/>
      <stop offset="0.65" stop-color="#111318"/>
      <stop offset="1" stop-color="#1C090D"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F43F4F"/>
      <stop offset="1" stop-color="#B8081C"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="408" rx="26" fill="url(#bg)" stroke="#30333A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="408" rx="26" fill="url(#grid)"/>

  <text x="44" y="43" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.8">ONE PRODUCT PATH / FOUR SURFACES</text>
  <text x="44" y="82" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800">From business rule to production release.</text>

  <path d="M307 230l11 7-11 7M594 230l11 7-11 7M881 230l11 7-11 7" fill="none" stroke="#F43F4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Backend -->
  <g transform="translate(38 108)" filter="url(#shadow)">
    <rect width="265" height="258" rx="20" fill="#14161B" stroke="#343840" stroke-width="2"/>
    <circle cx="132.5" cy="18" r="20" fill="#E11D2E"/>
    <path d="M124.5 12h16M124.5 18h16M124.5 24h16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="132.5" y="58" text-anchor="middle" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">01 / CORE</text>
    <text x="132.5" y="96" text-anchor="middle" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800">BACKEND</text>
    <text x="132.5" y="126" text-anchor="middle" fill="#B6BBC5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Rules · data · security</text>
    <path d="M24 145h217" stroke="#2D3037"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <rect x="24" y="158" width="76" height="32" rx="8" fill="#1D2939" stroke="#3776AB"/><text x="38" y="179" fill="#DCEBFA">PYTHON</text>
      <rect x="109" y="158" width="69" height="32" rx="8" fill="#10251C" stroke="#44B78B"/><text x="126" y="179" fill="#D8F3E8">DJANGO</text>
      <rect x="187" y="158" width="54" height="32" rx="8" fill="#29191D" stroke="#F43F4F"/><text x="201" y="179" fill="#FFDDE1">DRF</text>
      <rect x="24" y="200" width="108" height="32" rx="8" fill="#172131" stroke="#4169E1"/><text x="39" y="221" fill="#DCE5FF">POSTGRESQL</text>
      <rect x="141" y="200" width="100" height="32" rx="8" fill="#211A14" stroke="#D89B3C"/><text x="160" y="221" fill="#FFE6BF">PAYMENTS</text>
    </g>
  </g>

  <!-- Web -->
  <g transform="translate(325 108)" filter="url(#shadow)">
    <rect width="265" height="258" rx="20" fill="#14161B" stroke="#343840" stroke-width="2"/>
    <circle cx="132.5" cy="18" r="20" fill="#149ECA"/>
    <rect x="122.5" y="10" width="20" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><path d="M122.5 15h20" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="132.5" y="58" text-anchor="middle" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">02 / OPERATE</text>
    <text x="132.5" y="96" text-anchor="middle" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800">WEB</text>
    <text x="132.5" y="126" text-anchor="middle" fill="#B6BBC5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Admin · clients · booking</text>
    <path d="M24 145h217" stroke="#2D3037"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <rect x="24" y="158" width="75" height="32" rx="8" fill="#10242A" stroke="#61DAFB"/><text x="40" y="179" fill="#D8F7FF">REACT</text>
      <rect x="108" y="158" width="59" height="32" rx="8" fill="#2A2410" stroke="#F7DF1E"/><text x="122" y="179" fill="#FFF6B2">JS</text>
      <rect x="176" y="158" width="65" height="32" rx="8" fill="#21151D" stroke="#FF4785"/><text x="190" y="179" fill="#FFD9E8">VITE</text>
      <rect x="24" y="200" width="99" height="32" rx="8" fill="#171D29" stroke="#8B9DC3"/><text x="42" y="221" fill="#E1E7F2">REST API</text>
      <rect x="132" y="200" width="109" height="32" rx="8" fill="#1D1A28" stroke="#8B5CF6"/><text x="147" y="221" fill="#EAE0FF">WORKFLOWS</text>
    </g>
  </g>

  <!-- Mobile -->
  <g transform="translate(612 108)" filter="url(#shadow)">
    <rect width="265" height="258" rx="20" fill="#14161B" stroke="#343840" stroke-width="2"/>
    <circle cx="132.5" cy="18" r="20" fill="#7656FF"/>
    <rect x="125.5" y="6" width="14" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><circle cx="132.5" cy="25" r="1.5" fill="#FFFFFF"/>
    <text x="132.5" y="58" text-anchor="middle" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">03 / MEMBER</text>
    <text x="132.5" y="96" text-anchor="middle" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800">MOBILE</text>
    <text x="132.5" y="126" text-anchor="middle" fill="#B6BBC5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Membership · QR · access</text>
    <path d="M24 145h217" stroke="#2D3037"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <rect x="24" y="158" width="75" height="32" rx="8" fill="#10242A" stroke="#61DAFB"/><text x="40" y="179" fill="#D8F7FF">REACT</text>
      <rect x="108" y="158" width="64" height="32" rx="8" fill="#211B38" stroke="#A98BFF"/><text x="124" y="179" fill="#ECE5FF">EXPO</text>
      <rect x="181" y="158" width="60" height="32" rx="8" fill="#172131" stroke="#3B82F6"/><text x="197" y="179" fill="#DBEAFE">EAS</text>
      <rect x="24" y="200" width="105" height="32" rx="8" fill="#1B1D22" stroke="#6B7280"/><text x="40" y="221" fill="#E5E7EB">NAVIGATION</text>
      <rect x="138" y="200" width="103" height="32" rx="8" fill="#13241B" stroke="#3FB950"/><text x="158" y="221" fill="#DDF8E5">QR ACCESS</text>
    </g>
  </g>

  <!-- Ship -->
  <g transform="translate(899 108)" filter="url(#shadow)">
    <rect width="265" height="258" rx="20" fill="#14161B" stroke="#343840" stroke-width="2"/>
    <circle cx="132.5" cy="18" r="20" fill="#F43F4F"/>
    <path d="M121.5 22h22M125.5 22v-8l7-5 7 5v8M128.5 27h8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132.5" y="58" text-anchor="middle" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">04 / RELEASE</text>
    <text x="132.5" y="96" text-anchor="middle" fill="#F7F8FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800">SHIP</text>
    <text x="132.5" y="126" text-anchor="middle" fill="#B6BBC5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">CI/CD · cloud · recovery</text>
    <path d="M24 145h217" stroke="#2D3037"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <rect x="24" y="158" width="77" height="32" rx="8" fill="#152238" stroke="#2496ED"/><text x="38" y="179" fill="#DCEEFF">DOCKER</text>
      <rect x="110" y="158" width="62" height="32" rx="8" fill="#211A2B" stroke="#A371F7"/><text x="125" y="179" fill="#EBDDFF">CI/CD</text>
      <rect x="181" y="158" width="60" height="32" rx="8" fill="#2A1B12" stroke="#F48120"/><text x="196" y="179" fill="#FFE4CF">EDGE</text>
      <rect x="24" y="200" width="100" height="32" rx="8" fill="#13241B" stroke="#3FB950"/><text x="42" y="221" fill="#DDF8E5">BACKUPS</text>
      <rect x="133" y="200" width="108" height="32" rx="8" fill="#29191D" stroke="#F43F4F"/><text x="148" y="221" fill="#FFDDE1">ROLLBACKS</text>
    </g>
  </g>

  <text x="600" y="394" text-anchor="middle" fill="#8C929E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">ONE PRODUCT · ONE RELEASE PATH · NO HAND-OFF GAPS</text>
</svg>
